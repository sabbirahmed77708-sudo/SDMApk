<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin sign in · SdmApk</title>
<meta name="theme-color" content="#0b1020">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=Sora:wght@600..800&display=swap">
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/assets/admin.css">
<script src="/assets/theme.js"></script>
</head>
<body>
<main class="login-wrap" id="main">
<div class="login-card">
<a class="brand" href="/" aria-label="SdmApk home"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="18" fill="#0b1020"/><path d="M43 24a10 10 0 1 0-11 10" fill="none" stroke="#ffc15e" stroke-width="8"/><path d="M21 40a10 10 0 1 0 11-10" fill="none" stroke="#ff4f78" stroke-width="8"/></svg>SdmApk</a>
<h1>Admin sign in</h1>
<p class="hint">Sign in to manage apps and categories.</p>
<form id="login-form" novalidate>
<div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required></div>
<div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
<button class="btn btn-primary btn-lg" type="submit" id="login-btn">Sign in</button>
<p class="msg err" id="msg" role="alert"></p>
</form>
<p class="hint"><a href="/">Back to SdmApk</a></p>
</div>
</main>
<script src="/assets/login.js" defer></script>
</body>
</html>
