<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin sign in · SdmApk</title>
<meta name="theme-color" content="#0a5c46">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=Sora:wght@600..800&display=swap">
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/assets/admin.css">
<script src="/assets/theme.js"></script>
</head>
<body>
<main class="login-wrap" id="main">
<div class="login-card">
<a class="brand" href="/" aria-label="SdmApk home"><svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d7a5e"/><stop offset="1" stop-color="#053a2c"/></linearGradient></defs><rect width="64" height="64" rx="18" fill="url(#sg)"/><g transform="translate(-3 -2)" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M46 17H21a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h22a2 2 0 0 1 2 2v7" stroke="#fff"/><path d="M36 41.5l9 9 9-9" stroke="#ff6a4d"/></g></svg>SdmApk</a>
<h1>Admin sign in</h1>
<p class="hint">Sign in to manage apps and categories.</p>
<form id="login-form" novalidate>
<div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required></div>
<div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
<button class="btn btn-primary btn-lg" type="submit" id="login-btn">Sign in</button>
<p class="msg err" id="msg" role="alert"></p>
</form>
<p class="hint"><a href="/">Back to SdmApk</a></p>
</div>
</main>
<script src="/assets/login.js" defer></script>
</body>
</html>
