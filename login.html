<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin Login · AppNook</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d1020;color:#f7f8ff;font:16px system-ui;padding:20px}.panel{width:min(420px,100%);background:#171b30;border:1px solid #292f4b;border-radius:20px;padding:28px;box-shadow:0 20px 60px #0005}.brand{font-size:1.6rem;font-weight:850}.brand span{color:#a99fff}p{color:#aab1c8}label{display:block;margin:16px 0 6px}input{width:100%;padding:13px;border-radius:10px;border:1px solid #414766;background:#0d1020;color:white;font:inherit}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:10px;background:#6f61ed;color:white;font-weight:700;font:inherit;cursor:pointer}#msg{min-height:24px;color:#ffaaa8;font-size:.9rem}a{color:#c8c0ff}</style></head><body><main class="panel"><div class="brand">App<span>Nook</span></div><h1>Admin Login</h1><p>Sign in to manage the app directory.</p><form id="login"><label for="username">Username</label><input id="username" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button>Sign in</button><div id="msg" role="alert"></div></form><a href="/">← Back to AppNook</a></main><script>document.getElementById("login").addEventListener("submit",async e=>{e.preventDefault();const m=document.getElementById("msg");m.textContent="Signing in…";try{const r=await fetch("/api/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({username:document.getElementById("username").value,password:document.getElementById("password").value})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Login failed");location.href="/admin/";}catch(err){m.textContent=err.message;}});</script></body></html>
