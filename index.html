<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin Dashboard · AppNook</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0d1020;color:#f7f8ff;font:15px/1.5 system-ui;padding:20px}.wrap{max-width:1050px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-size:1.5rem;font-weight:850}.brand span{color:#a99fff}button,.link{border:0;border-radius:9px;padding:10px 14px;background:#6f61ed;color:white;font:inherit;cursor:pointer;text-decoration:none}.secondary{background:#292f4b}.panel{background:#171b30;border:1px solid #292f4b;border-radius:16px;padding:18px;margin:20px 0}h1{font-size:1.7rem}h2{margin-top:0}form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:grid;gap:5px;color:#c8cce0}input,textarea{width:100%;padding:11px;border:1px solid #414766;border-radius:9px;background:#0d1020;color:white;font:inherit}textarea{min-height:80px;resize:vertical}.wide{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap}.danger{background:#a43c52}.app{display:flex;justify-content:space-between;gap:14px;align-items:center;border-top:1px solid #292f4b;padding:14px 0}.muted{color:#aab1c8}#message{min-height:24px;color:#bdb5ff}@media(max-width:600px){form{grid-template-columns:1fr}.wide{grid-column:auto}.app{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><header><div class="brand">App<span>Nook</span> <small class="muted">Admin</small></div><div class="actions"><a class="link secondary" href="/" target="_blank" rel="noopener">View site</a><button id="logout" class="secondary">Log out</button></div></header><h1>App management</h1><p class="muted">Only authenticated admins can add, edit or remove apps.</p><section class="panel"><h2 id="formTitle">Add an app</h2><form id="appForm"><input type="hidden" id="appId"><label>App name *<input id="name" maxlength="100" required></label><label>Category<input id="category" maxlength="80" placeholder="Tools"></label><label>Version<input id="version" maxlength="80" placeholder="1.0"></label><label>Icon URL (HTTPS)<input id="icon" type="url" placeholder="https://..."></label><label class="wide">Description<textarea id="description" maxlength="1000"></textarea></label><label class="wide">Download URL (HTTPS) *<input id="download" type="url" required placeholder="https://official-site.example/download"></label><div class="wide actions"><button id="save">Save app</button><button type="button" id="cancel" class="secondary" hidden>Cancel edit</button></div></form><p id="message" role="status"></p></section><section class="panel"><h2>Apps</h2><div id="apps"><p class="muted">Loading…</p></div></section></div><script>
const $=id=>document.getElementById(id);let items=[];
async function api(url,options={}){const r=await fetch(url,{...options,headers:{"content-type":"application/json",...(options.headers||{})}});const d=await r.json().catch(()=>({}));if(r.status===401){location.href="/admin/login.html";throw new Error("Please sign in again");}if(!r.ok)throw new Error(d.error||"Request failed");return d;}
const val=id=>$(id).value.trim();
function reset(){$("appForm").reset();$("appId").value="";$("formTitle").textContent="Add an app";$("save").textContent="Save app";$("cancel").hidden=true;}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function render(){$("apps").innerHTML=items.length?items.map(a=>'<div class="app"><div><strong>'+esc(a.name)+'</strong><div class="muted">'+esc(a.category||"Other")+' · '+esc(a.version||"")+'</div><div class="muted">'+esc(a.download_url)+'</div></div><div class="actions"><button class="secondary" data-edit="'+a.id+'">Edit</button><button class="danger" data-delete="'+a.id+'">Delete</button></div></div>').join(""):'<p class="muted">No apps yet. Add your first app above.</p>';}
async function load(){const d=await api("/api/apps");items=d.apps||[];render();}
$("appForm").addEventListener("submit",async e=>{e.preventDefault();$("message").textContent="Saving…";const data={name:val("name"),category:val("category"),version:val("version"),icon_url:val("icon"),description:val("description"),download_url:val("download")},id=val("appId");try{await api(id?"/api/apps/"+id:"/api/apps",{method:id?"PUT":"POST",body:JSON.stringify(data)});$("message").textContent="Saved successfully.";reset();await load();}catch(err){$("message").textContent=err.message;}});
$("apps").addEventListener("click",async e=>{const ed=e.target.closest("[data-edit]"),del=e.target.closest("[data-delete]");if(ed){const a=items.find(x=>String(x.id)===ed.dataset.edit);if(!a)return;$("appId").value=a.id;$("name").value=a.name||"";$("category").value=a.category||"";$("version").value=a.version||"";$("icon").value=a.icon_url||"";$("description").value=a.description||"";$("download").value=a.download_url||"";$("formTitle").textContent="Edit app";$("save").textContent="Update app";$("cancel").hidden=false;scrollTo({top:0,behavior:"smooth"});}if(del){const a=items.find(x=>String(x.id)===del.dataset.delete);if(!a||!confirm('Delete "'+a.name+'"?'))return;try{await api("/api/apps/"+a.id,{method:"DELETE"});$("message").textContent="App deleted.";await load();}catch(err){$("message").textContent=err.message;}}});
$("cancel").addEventListener("click",reset);$("logout").addEventListener("click",async()=>{try{await api("/api/logout",{method:"POST"});}finally{location.href="/admin/login.html";}});
(async()=>{try{await api("/api/me");await load();}catch(e){$("message").textContent=e.message;}})();
</script></body></html>
