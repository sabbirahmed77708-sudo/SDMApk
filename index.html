<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101326"><meta name="description" content="AppNook — discover useful apps in one simple place.">
<title>AppNook — Apps, all in one nook</title>
<style>
:root{color-scheme:dark;--bg:#0d1020;--panel:#171b30;--muted:#aab1c8;--text:#f7f8ff;--accent:#8b7cff;--line:#292f4b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -10%,#302b65 0,transparent 42%),var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{width:min(1120px,92%);margin:auto}.top{display:flex;align-items:center;justify-content:space-between;padding:24px 0}.brand{font-size:1.55rem;font-weight:850;letter-spacing:-.06em}.brand span{color:var(--accent)}.top a{color:#d8d4ff;text-decoration:none;font-size:.92rem}
.hero{padding:76px 0 48px;text-align:center}.eyebrow{color:#b9b1ff;font-size:.78rem;font-weight:750;letter-spacing:.16em;text-transform:uppercase}.hero h1{font-size:clamp(2.5rem,7vw,5rem);line-height:1.04;letter-spacing:-.065em;margin:16px 0}.hero h1 em{font-style:normal;color:#a99fff}.hero p{max-width:590px;margin:0 auto;color:var(--muted);font-size:1.08rem}
.searchbox{max-width:650px;margin:30px auto 0;display:flex;gap:10px;background:#fff;padding:7px;border-radius:16px;box-shadow:0 15px 50px #0005}.searchbox input{flex:1;min-width:0;border:0;outline:0;padding:12px 14px;color:#17172a;font:inherit;background:transparent}.searchbox button{border:0;border-radius:11px;background:#6f61ed;color:white;padding:0 22px;font-weight:700}
main{padding:30px 0 80px}.sectionhead{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:18px}.sectionhead h2{font-size:1.55rem;margin:0;letter-spacing:-.04em}.sectionhead p{margin:3px 0 0;color:var(--muted);font-size:.9rem}
.filters{display:flex;gap:9px;flex-wrap:wrap;margin:22px 0}.chip{border:1px solid var(--line);background:#171b30;color:#c8cce0;border-radius:99px;padding:8px 15px;font:inherit;font-size:.88rem;cursor:pointer}.chip.active,.chip:hover{background:#6f61ed;border-color:#6f61ed;color:white}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.app{background:linear-gradient(145deg,#1b2038,#14182b);border:1px solid var(--line);border-radius:20px;padding:20px;transition:.2s}.app:hover{transform:translateY(-3px);border-color:#6258bd}.apphead{display:flex;align-items:center;gap:13px}.appicon{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font-size:1.65rem;background:#29264b;overflow:hidden}.appicon img{width:100%;height:100%;object-fit:cover}.app h3{margin:0;font-size:1.05rem}.meta{color:#a9b0c7;font-size:.82rem}.app p{color:#c1c6d8;font-size:.9rem;min-height:48px;margin:16px 0}.download{display:inline-flex;text-decoration:none;background:#29244f;color:#dcd8ff;border:1px solid #494080;padding:9px 14px;border-radius:11px;font-size:.87rem;font-weight:700}.download:hover{background:#6f61ed;color:white}
.empty{grid-column:1/-1;text-align:center;padding:48px 20px;border:1px dashed #414766;border-radius:20px;color:var(--muted)}.empty strong{display:block;color:white;font-size:1.1rem;margin-bottom:6px}
footer{border-top:1px solid var(--line);padding:25px 0;color:#939bb5;font-size:.85rem}.foot{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding-top:54px}}@media(max-width:540px){.grid{grid-template-columns:1fr}.hero{padding-top:40px}.searchbox{border-radius:13px}.searchbox button{padding:0 14px}.sectionhead{display:block}}
</style></head>
<body>
<header class="wrap top"><div class="brand">App<span>Nook</span></div><a href="#apps">Explore apps ↘</a></header>
<section class="wrap hero"><div class="eyebrow">A little nook for great apps</div><h1>Find your next<br><em>favorite app.</em></h1><p>Discover useful apps, explore by category, and get downloads from trusted sources — all in one simple place.</p><form class="searchbox" id="searchForm"><input id="search" type="search" placeholder="Search apps..." aria-label="Search apps"><button type="submit">Search</button></form></section>
<main class="wrap" id="apps"><div class="sectionhead"><div><h2>Explore apps</h2><p>Handy picks to get you started.</p></div></div><nav class="filters" id="filters" aria-label="App categories"><button class="chip active" data-category="All">All apps</button></nav><section class="grid" id="appGrid" aria-live="polite"><div class="empty">Loading apps…</div></section></main>
<footer><div class="wrap foot"><span>© <span id="year"></span> AppNook</span><span>Simple discovery. Trusted downloads.</span></div></footer>
<script>
let active="All",apps=[];const grid=document.getElementById("appGrid"),search=document.getElementById("search"),filters=document.getElementById("filters");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function renderFilters(){const cats=["All",...new Set(apps.map(a=>a.category||"Other").filter(Boolean))];filters.innerHTML=cats.map(c=>'<button class="chip '+(c===active?'active':'')+'" data-category="'+esc(c)+'">'+(c==="All"?"All apps":esc(c))+'</button>').join("");}
function render(){const q=search.value.trim().toLowerCase();const shown=apps.filter(a=>(active==="All"||(a.category||"Other")===active)&&(a.name+" "+a.category+" "+a.description).toLowerCase().includes(q));grid.innerHTML=shown.length?shown.map(a=>'<article class="app"><div class="apphead"><div class="appicon" aria-hidden="true">'+(a.icon_url?'<img src="'+esc(a.icon_url)+'" alt="">':esc((a.name||"A").slice(0,1).toUpperCase()))+'</div><div><h3>'+esc(a.name)+'</h3><div class="meta">'+esc(a.category||"Other")+(a.version?' · '+esc(a.version):'')+'</div></div></div><p>'+esc(a.description||"")+'</p><a class="download" href="'+esc(a.download_url)+'" target="_blank" rel="noopener noreferrer">Download ↗</a></article>').join(""):'<div class="empty"><strong>No apps found</strong>Try another search or category.</div>';}
async function loadApps(){try{const r=await fetch("/api/apps",{cache:"no-store"});if(!r.ok)throw new Error("Could not load apps");const d=await r.json();apps=d.apps||[];renderFilters();render();}catch(e){grid.innerHTML='<div class="empty"><strong>Apps are temporarily unavailable</strong>Please try again later.</div>';}}
filters.addEventListener("click",e=>{const b=e.target.closest("button[data-category]");if(!b)return;active=b.dataset.category;renderFilters();render();});
document.getElementById("searchForm").addEventListener("submit",e=>{e.preventDefault();render();});search.addEventListener("input",render);document.getElementById("year").textContent=new Date().getFullYear();loadApps();
</script></body></html>
